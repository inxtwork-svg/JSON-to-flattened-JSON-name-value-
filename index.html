<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON Name/Value Converter</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

/* =========================================================
   GLOBAL STYLES
========================================================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  min-height:100vh;
  background:radial-gradient(circle at top,#1e293b,#020617);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
}

/* =========================================================
   MAIN CONTAINER
========================================================= */

.container{
  width:1100px;
  max-width:95%;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(14px);
  border-radius:20px;
  padding:30px;
  box-shadow:0 0 60px rgba(0,0,0,.6);
}

/* =========================================================
   HEADER
========================================================= */

.header{
  text-align:center;
  margin-bottom:30px;
}

.header h1{
  font-size:34px;
  font-weight:600;
}

.header p{
  margin-top:6px;
  opacity:.7;
}

/* =========================================================
   MAIN GRID
========================================================= */

.main{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:25px;
}

/* =========================================================
   CARD
========================================================= */

.card{
  background:rgba(255,255,255,0.04);
  border-radius:16px;
  padding:25px;
  border:1px solid rgba(255,255,255,0.08);
}

/* =========================================================
   UPLOAD BOX
========================================================= */

.upload-box{
  border:2px dashed #3b82f6;
  border-radius:14px;
  padding:40px 20px;
  text-align:center;
  cursor:pointer;
  transition:0.3s;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
}

.upload-box:hover{
  background:rgba(59,130,246,0.08);
}

.upload-box input{
  display:none;
}

.upload-box span{
  font-size:16px;
  font-weight:500;
}

.file-info{
  margin-top:10px;
  font-size:14px;
  color:#93c5fd;
}

/* =========================================================
   BUTTONS
========================================================= */

.buttons{
  display:flex;
  gap:15px;
  margin-top:20px;
}

button{
  flex:1;
  padding:12px;
  border:none;
  border-radius:8px;
  font-weight:600;
  cursor:pointer;
  transition:0.3s;
}

.convert{
  background:#3b82f6;
  color:white;
}

.convert:hover{
  background:#2563eb;
}

.download{
  background:#10b981;
  color:white;
}

.download:hover{
  background:#059669;
}

button:disabled{
  opacity:0.4;
  cursor:not-allowed;
}

/* =========================================================
   OUTPUT BOX
========================================================= */

.output{
  background:#020617;
  border-radius:12px;
  padding:20px;
  height:360px;
  overflow:auto;
  font-size:14px;
  border:1px solid #1e293b;
  white-space:pre-wrap;
}

/* =========================================================
   STATUS
========================================================= */

.status{
  margin-top:15px;
  text-align:center;
  color:#22c55e;
  font-size:14px;
}

/* =========================================================
   FOOTER
========================================================= */

.footer{
  text-align:center;
  margin-top:30px;
  font-size:13px;
  opacity:.6;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:768px){
  .main{
    grid-template-columns:1fr;
  }
  .output{
    height:280px;
  }
}

</style>
</head>

<body>

<div class="container">

  <!-- HEADER -->
  <div class="header">
    <h1>JSON → Name / Value Converter</h1>
    <p>Upload • Convert • Download — Professional Tool</p>
  </div>

  <!-- MAIN -->
  <div class="main">

    <!-- LEFT PANEL -->
    <div class="card">

      <label class="upload-box">
        📁 <span>Click or Drop JSON File</span>
        <input type="file" id="fileInput" accept=".json">
        <div class="file-info" id="fileInfo">No file selected</div>
      </label>

      <div class="buttons">
        <button class="convert" id="convertBtn" disabled>Convert</button>
        <button class="download" id="downloadBtn" disabled>Download</button>
      </div>

      <div class="status" id="status"></div>

    </div>

    <!-- RIGHT PANEL -->
    <div class="card">
      <pre class="output" id="output">Converted JSON will appear here...</pre>
    </div>

  </div>

  <div class="footer">
    © 2026 HYCONE PROJECTS PRIVATE LIMITED. All Rights Reserved.

  </div>

</div>

<script>

/* =========================================================
   VARIABLES
========================================================= */

let convertedData = [];
const fileInput = document.getElementById("fileInput");
const fileInfo  = document.getElementById("fileInfo");
const output    = document.getElementById("output");
const statusBox = document.getElementById("status");
const convertBtn= document.getElementById("convertBtn");
const downloadBtn=document.getElementById("downloadBtn");

/* =========================================================
   FILE UPLOAD
========================================================= */

fileInput.addEventListener("change",()=>{
  const file = fileInput.files[0];
  if(file){
    fileInfo.textContent = `📄 ${file.name} (${(file.size/1024).toFixed(1)} KB)`;
    statusBox.textContent = "File uploaded successfully ✅";
    convertBtn.disabled = false;
  }
});

/* =========================================================
   FLATTEN JSON
========================================================= */

function flattenJSON(obj, result = []){
  for(let key in obj){
    if(typeof obj[key] === "object" && obj[key] !== null){
      flattenJSON(obj[key], result);
    } else {
      result.push({
        name: key,
        value: obj[key]
      });
    }
  }
  return result;
}

/* =========================================================
   CONVERT FUNCTION
========================================================= */

convertBtn.addEventListener("click",()=>{
  const file = fileInput.files[0];
  if(!file) return;

  const reader = new FileReader();

  reader.onload = e=>{
    const jsonData = JSON.parse(e.target.result);

    if(jsonData.Flights){
      convertedData = flattenJSON(jsonData.Flights[0]);
    }else{
      convertedData = flattenJSON(jsonData);
    }

    output.textContent = JSON.stringify(convertedData,null,2);
    statusBox.textContent = "Conversion completed successfully ✅";
    downloadBtn.disabled = false;
  };

  reader.readAsText(file);
});

/* =========================================================
   DOWNLOAD FUNCTION
========================================================= */

downloadBtn.addEventListener("click",()=>{
  const blob = new Blob(
    [JSON.stringify(convertedData,null,2)],
    {type:"application/json"}
  );

  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "converted.json";
  link.click();

  statusBox.textContent = "File downloaded successfully ⬇️";
});

</script>

</body>
</html>
